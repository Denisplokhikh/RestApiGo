version: '3.9'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=host=db port=5432 user=postgres password=postgres dbname=tasks sslmode=disable
    depends_on:
      - db
    # ВОТ ГЛАВНОЕ - volume для горячей перезагрузки
    volumes:
      - .:/app
      - /app/tmp # Игнорируем tmp папку контейнера
    restart: on-failure
    command: air -c .air.toml

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasks
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
